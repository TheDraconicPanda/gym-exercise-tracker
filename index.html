<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251f">
  <title>Gym Exercise Tracker · v0.2.1</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <nav class="day-navigation" aria-label="Workout day">
      <button id="previous-day" aria-label="Previous day">‹</button>
      <div><p id="day-status">Today</p><span id="day-label"></span></div>
      <button id="next-day" aria-label="Next day">›</button>
    </nav>
    <div class="workout-heading"><h1 id="workout-title"></h1><button id="today-button" hidden>Today</button></div>
    <p id="session-time"></p>
    <section id="workout-list" aria-label="Exercises"></section>
    <p id="save-status" role="status"></p>
    <p class="input-help">Tap to type, or hold a number and slide up or down.</p>
    <div id="session-extras"><p><strong>Warm-up</strong><span id="warmup"></span></p><p><strong>Cool-down</strong><span id="cooldown"></span></p><p id="workout-note"></p></div>
    <details class="weekly-overview"><summary>Weekly overview</summary><p class="storage-note">v0.2.1</p><div class="summary-grid"><div><span>Planned this week</span><strong>4 sessions</strong><small>Mon · Wed · Thu · Sat</small></div><div><span>Session time</span><strong>≤40 min</strong></div><div><span>Current focus</span><strong>Strength</strong></div></div></details>
    <p class="storage-note">History stays in this browser. Clearing site data removes it.</p>
  </main>
</body>
</html>
